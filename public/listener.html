<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Translation</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #faf7f2;
      color: #2c2417;
      font-family: Georgia, 'Times New Roman', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid #e5d9c8;
      background: #fdf9f4;
    }

    header h1 {
      font-size: 0.95rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #8a7560;
    }

    /* LIVE badge */
    #liveBadge {
      display: none;
      align-items: center;
      gap: 6px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #c53030;
      text-transform: uppercase;
    }

    #liveBadge.visible { display: flex; }

    #liveDot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e53e3e;
      animation: blink 1.2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* Transcript area */
    #transcriptArea {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .final-line {
      font-size: 1.15rem;
      line-height: 1.65;
      color: #1a1208;
      font-weight: 600;
    }

    #interimLine {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #9c8b72;
      font-style: italic;
      min-height: 1.6em;
    }

    /* Footer status */
    footer {
      padding: 12px 20px;
      border-top: 1px solid #e5d9c8;
      background: #fdf9f4;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 0.75rem;
      color: #a89880;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #statusDot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ccc;
      flex-shrink: 0;
      transition: background 0.3s;
    }

    #statusDot.connected  { background: #38a169; }
    #statusDot.receiving  { background: #3182ce; }

    /* iOS tap-to-start overlay */
    #tapOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(250,247,242,0.95);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      text-align: center;
      padding: 32px;
    }

    #tapOverlay.visible { display: flex; }

    #tapOverlay p {
      font-size: 1.1rem;
      color: #5a4a35;
      line-height: 1.5;
    }

    #tapBtn {
      padding: 16px 40px;
      font-size: 1rem;
      font-family: Georgia, serif;
      background: #8a5c2e;
      color: #fdf9f4;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 0.05em;
    }

    #tapBtn:active { opacity: 0.8; }
  </style>
</head>
<body>

  <!-- iOS tap-to-start overlay -->
  <div id="tapOverlay">
    <p>Tap below to begin receiving the live translation audio.</p>
    <button id="tapBtn">Start Audio</button>
  </div>

  <header>
    <h1>Live Translation</h1>
    <div id="liveBadge">
      <div id="liveDot"></div>
      <span>Live</span>
    </div>
  </header>

  <div id="transcriptArea">
    <div id="interimLine"></div>
  </div>

  <footer>
    <div id="statusDot"></div>
    <span id="statusText">Connecting...</span>
  </footer>

  <script>
    const liveBadge      = document.getElementById('liveBadge');
    const transcriptArea = document.getElementById('transcriptArea');
    const interimLine    = document.getElementById('interimLine');
    const statusDot      = document.getElementById('statusDot');
    const statusText     = document.getElementById('statusText');
    const tapOverlay     = document.getElementById('tapOverlay');
    const tapBtn         = document.getElementById('tapBtn');

    // ── Audio context & jitter buffer ───────────────────────────────
    let audioCtx = null;
    let audioQueue = [];        // decoded AudioBuffers waiting to play
    let nextStartTime = 0;      // when the next chunk should start playing
    let playing = false;
    const JITTER_COUNT = 2;     // buffered chunks before starting

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    // Show tap overlay if AudioContext needs user gesture (iOS Safari)
    function maybeShowTapOverlay() {
      const ctx = getAudioContext();
      if (ctx.state === 'suspended') {
        tapOverlay.classList.add('visible');
      }
    }

    tapBtn.addEventListener('click', async () => {
      const ctx = getAudioContext();
      await ctx.resume();
      tapOverlay.classList.remove('visible');
      // Try to drain queue now that audio is unlocked
      if (audioQueue.length >= JITTER_COUNT) startPlayback();
    });

    function enqueueAudio(arrayBuffer) {
      const ctx = getAudioContext();
      ctx.decodeAudioData(arrayBuffer.slice(0), (decoded) => {
        audioQueue.push(decoded);

        if (!playing && audioQueue.length >= JITTER_COUNT) {
          if (ctx.state === 'suspended') {
            maybeShowTapOverlay();
            return;
          }
          startPlayback();
        }
      }, (err) => {
        // Ignore decode errors for partial chunks
      });
    }

    function startPlayback() {
      playing = true;
      nextStartTime = getAudioContext().currentTime;
      drainQueue();
    }

    function drainQueue() {
      const ctx = getAudioContext();
      while (audioQueue.length > 0) {
        const buffer = audioQueue.shift();
        const source = ctx.createBufferSource();
        source.buffer = buffer;
        source.connect(ctx.destination);

        // Schedule back-to-back with no gaps
        const startAt = Math.max(nextStartTime, ctx.currentTime);
        source.start(startAt);
        nextStartTime = startAt + buffer.duration;

        source.onended = () => {
          // If queue drained, mark as not playing
          if (audioQueue.length === 0) {
            playing = false;
          }
        };
      }
    }

    // When new chunks arrive while already playing, drain immediately
    function scheduleNewChunk(buffer) {
      if (!playing) {
        audioQueue.push(buffer);
        if (audioQueue.length >= JITTER_COUNT) {
          const ctx = getAudioContext();
          if (ctx.state !== 'suspended') startPlayback();
          else maybeShowTapOverlay();
        }
      } else {
        // Already playing — schedule it directly
        const ctx = getAudioContext();
        const source = ctx.createBufferSource();
        source.buffer = buffer;
        source.connect(ctx.destination);
        const startAt = Math.max(nextStartTime, ctx.currentTime);
        source.start(startAt);
        nextStartTime = startAt + buffer.duration;
      }
    }

    // ── Transcript ──────────────────────────────────────────────────
    function appendFinalLine(text) {
      const div = document.createElement('div');
      div.className = 'final-line';
      div.textContent = text;
      // Insert before the interim line
      transcriptArea.insertBefore(div, interimLine);
      interimLine.textContent = '';
      interimLine.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }

    function setInterimLine(text) {
      interimLine.textContent = text;
      interimLine.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }

    // ── WebSocket ───────────────────────────────────────────────────
    let ws = null;
    let reconnectTimer = null;
    let hasReceivedAudio = false;

    function connect() {
      const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${protocol}://${window.location.host}`);
      ws.binaryType = 'arraybuffer';

      ws.addEventListener('open', () => {
        ws.send(JSON.stringify({ type: 'listener' }));
        statusDot.className = 'connected';
        statusText.textContent = 'Connected — waiting for broadcast';
        clearTimeout(reconnectTimer);
      });

      ws.addEventListener('message', (evt) => {
        if (evt.data instanceof ArrayBuffer) {
          // Audio chunk
          hasReceivedAudio = true;
          liveBadge.classList.add('visible');
          statusDot.className = 'receiving';
          statusText.textContent = 'Receiving audio';

          // Decode and play
          const ctx = getAudioContext();
          if (ctx.state === 'suspended') {
            maybeShowTapOverlay();
            // Still buffer even if suspended, will drain on tap
            audioQueue.push(null); // placeholder — will decode after resume
            // Actually decode properly:
            audioQueue.pop();
            ctx.decodeAudioData(evt.data.slice(0), (decoded) => {
              if (!playing && audioQueue.length >= JITTER_COUNT) return; // already draining
              audioQueue.push(decoded);
            }, () => {});
          } else {
            ctx.decodeAudioData(evt.data.slice(0), (decoded) => {
              scheduleNewChunk(decoded);
            }, () => {});
          }

        } else {
          // JSON message
          try {
            const msg = JSON.parse(evt.data);
            if (msg.type === 'transcript') {
              if (msg.is_final) {
                if (msg.text.trim()) appendFinalLine(msg.text.trim());
              } else {
                setInterimLine(msg.text);
              }
            }
          } catch (e) { /* ignore */ }
        }
      });

      ws.addEventListener('close', () => {
        liveBadge.classList.remove('visible');
        statusDot.className = '';
        statusText.textContent = 'Signal lost. Reconnecting...';
        hasReceivedAudio = false;
        playing = false;
        audioQueue = [];
        scheduleReconnect();
      });

      ws.addEventListener('error', () => {
        ws.close();
      });
    }

    function scheduleReconnect() {
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(connect, 3000);
    }

    // ── Init ────────────────────────────────────────────────────────
    // Pre-create AudioContext so we can detect iOS suspension immediately
    try { getAudioContext(); } catch (e) {}
    connect();
  </script>
</body>
</html>
